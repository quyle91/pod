services:
  app:
    build: .
    user: "${HOST_USER:-1000:1000}"
    volumes:
      - ./source:/var/www/html
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
      - ./docker/php/zzz-uploads.ini:/usr/local/etc/php/conf.d/zzz-uploads.ini:ro
    networks:
      default:
      proxy_network:

  web:
    volumes:
      - ./source:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
      proxy_network:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME}.entrypoints=web"
      - "traefik.http.services.${APP_NAME}.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy_network"

  db:
    networks:
      default:

networks:
  proxy_network:
    external: true
    name: proxy_network
