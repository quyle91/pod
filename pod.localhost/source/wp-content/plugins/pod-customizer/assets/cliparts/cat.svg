<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <g fill="#f97316" stroke="#c2410c" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- Ears -->
    <polygon points="120,200 150,70 230,160"/>
    <polygon points="380,200 350,70 270,160"/>
    <polygon points="135,185 160,95 215,160" fill="#fbcfe8" stroke="none"/>
    <polygon points="365,185 340,95 285,160" fill="#fbcfe8" stroke="none"/>
    
    <!-- Head -->
    <ellipse cx="250" cy="240" rx="150" ry="120"/>
    
    <!-- Eyes -->
    <ellipse cx="200" cy="220" rx="16" ry="24" fill="#0f172a" stroke="none"/>
    <circle cx="204" cy="214" r="6" fill="#ffffff" stroke="none"/>
    <ellipse cx="300" cy="220" rx="16" ry="24" fill="#0f172a" stroke="none"/>
    <circle cx="304" cy="214" r="6" fill="#ffffff" stroke="none"/>
    
    <!-- Nose & Mouth -->
    <polygon points="250,250 240,240 260,240" fill="#ec4899" stroke="none"/>
    <path d="M250,250 L250,265 C240,275 225,275 220,265 M250,265 C260,275 275,275 280,265" fill="none" stroke="#0f172a" stroke-width="6"/>

    <!-- Whiskers -->
    <line x1="120" y1="230" x2="180" y2="235" stroke="#0f172a" stroke-width="5"/>
    <line x1="110" y1="255" x2="180" y2="250" stroke="#0f172a" stroke-width="5"/>
    <line x1="380" y1="230" x2="320" y2="235" stroke="#0f172a" stroke-width="5"/>
    <line x1="390" y1="255" x2="320" y2="250" stroke="#0f172a" stroke-width="5"/>

    <!-- Paws -->
    <ellipse cx="200" cy="340" rx="36" ry="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="6"/>
    <ellipse cx="300" cy="340" rx="36" ry="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="6"/>
  </g>
</svg>
